<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Clientes | Locadora de Veículos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/estilo.css" rel="stylesheet">
</head>
<body>
    <div id="menu"></div>

    <main class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <h1 class="h3 mb-0">Clientes</h1>
                <span class="rota">GET /api/clientes?nome=&amp;cpf=&amp;email=</span>
            </div>
            <button class="btn btn-primary" id="btnNovo"><i class="bi bi-plus-lg"></i> Novo cliente</button>
        </div>

        <form id="formFiltro" class="card card-body mb-3">
            <div class="row g-2 align-items-end">
                <div class="col-md-4">
                    <label class="form-label" for="filtroNome">Nome</label>
                    <input class="form-control" id="filtroNome" name="nome" placeholder="Ex.: Maria">
                </div>
                <div class="col-md-2">
                    <label class="form-label" for="filtroCpf">CPF</label>
                    <input class="form-control" id="filtroCpf" name="cpf" inputmode="numeric" placeholder="Só números">
                </div>
                <div class="col-md-3">
                    <label class="form-label" for="filtroEmail">E-mail</label>
                    <input class="form-control" id="filtroEmail" name="email" placeholder="Ex.: gmail">
                </div>
                <div class="col-md-3 d-flex gap-2">
                    <button class="btn btn-secondary flex-fill" type="submit"><i class="bi bi-search"></i> Pesquisar</button>
                    <button class="btn btn-outline-secondary" type="reset">Limpar</button>
                </div>
            </div>
        </form>

        <div class="card">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>CPF</th>
                            <th>E-mail</th>
                            <th>Telefone</th>
                            <th>CNH</th>
                            <th class="acoes">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabela"></tbody>
                </table>
            </div>
            <div class="card-footer small text-muted" id="total"></div>
        </div>
    </main>

    <div class="modal fade" id="modalFormulario" tabindex="-1">
        <div class="modal-dialog">
            <form class="modal-content" id="formCadastro">
                <div class="modal-header">
                    <h5 class="modal-title" id="tituloModal">Novo cliente</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label" for="campoNome">Nome *</label>
                        <input class="form-control" id="campoNome" name="nome" required maxlength="120">
                    </div>
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label" for="campoCpf">CPF * (11 números)</label>
                            <input class="form-control" id="campoCpf" name="cpf" required pattern="\d{11}" maxlength="11" inputmode="numeric">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="campoCnh">CNH</label>
                            <input class="form-control" id="campoCnh" name="cnh" maxlength="11" inputmode="numeric">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="campoEmail">E-mail *</label>
                        <input class="form-control" id="campoEmail" name="email" type="email" required maxlength="150">
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="campoTelefone">Telefone</label>
                        <input class="form-control" id="campoTelefone" name="telefone" maxlength="20">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/clientes.js"></script>
</body>
</html>
