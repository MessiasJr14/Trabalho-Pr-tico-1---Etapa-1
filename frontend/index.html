<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Início | Locadora de Veículos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/estilo.css" rel="stylesheet">
</head>
<body>
    <div id="menu"></div>

    <main class="container py-4">
        <h1 class="h3 mb-1">Painel da locadora</h1>
        <p class="text-muted mb-4">Visão geral com dados lidos da API em tempo real.</p>

        <div class="row g-3 mb-4" id="indicadores"></div>

        <div class="row g-4">
            <div class="col-lg-7">
                <div class="card h-100">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-start">
                            <div>
                                <h2 class="h5 mb-0">Aluguéis em aberto</h2>
                                <p class="rota mb-3">GET /api/alugueis/abertos</p>
                            </div>
                            <a class="btn btn-sm btn-outline-secondary" href="alugueis.html">Ver aluguéis</a>
                        </div>
                        <div class="table-responsive">
                            <table class="table table-sm mb-0">
                                <thead><tr><th>Cliente</th><th>Veículo</th><th>Fim previsto</th><th>Situação</th></tr></thead>
                                <tbody id="tabelaAbertos"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-lg-5">
                <div class="card h-100">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-start">
                            <div>
                                <h2 class="h5 mb-0">Veículos disponíveis</h2>
                                <p class="rota mb-3">GET /api/veiculos/disponiveis</p>
                            </div>
                            <a class="btn btn-sm btn-outline-secondary" href="veiculos.html">Ver veículos</a>
                        </div>
                        <div class="table-responsive">
                            <table class="table table-sm mb-0">
                                <thead><tr><th>Modelo</th><th>Categoria</th><th class="text-end">Diária</th></tr></thead>
                                <tbody id="tabelaDisponiveis"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/inicio.js"></script>
</body>
</html>
