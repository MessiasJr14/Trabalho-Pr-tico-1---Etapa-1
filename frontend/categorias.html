<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Categorias | Locadora de Veículos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/estilo.css" rel="stylesheet">
</head>
<body>
    <div id="menu"></div>

    <main class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <h1 class="h3 mb-0">Categorias</h1>
                <span class="rota">GET /api/categorias?nome=&amp;valorMin=&amp;valorMax=</span>
            </div>
            <button class="btn btn-primary" id="btnNovo"><i class="bi bi-plus-lg"></i> Nova categoria</button>
        </div>

        <form id="formFiltro" class="card card-body mb-3">
            <div class="row g-2 align-items-end">
                <div class="col-md-4">
                    <label class="form-label" for="filtroNome">Nome</label>
                    <input class="form-control" id="filtroNome" name="nome" placeholder="Ex.: SUV">
                </div>
                <div class="col-md-2">
                    <label class="form-label" for="filtroMin">Diária mínima (R$)</label>
                    <input class="form-control" id="filtroMin" name="valorMin" type="number" min="0" step="0.01">
                </div>
                <div class="col-md-2">
                    <label class="form-label" for="filtroMax">Diária máxima (R$)</label>
                    <input class="form-control" id="filtroMax" name="valorMax" type="number" min="0" step="0.01">
                </div>
                <div class="col-md-4 d-flex gap-2">
                    <button class="btn btn-secondary flex-fill" type="submit"><i class="bi bi-search"></i> Pesquisar</button>
                    <button class="btn btn-outline-secondary" type="reset">Limpar</button>
                </div>
            </div>
        </form>

        <div class="card">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead>
                        <tr>
                            <th>Id</th>
                            <th>Nome</th>
                            <th>Descrição</th>
                            <th class="text-end">Valor da diária</th>
                            <th class="acoes">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabela"></tbody>
                </table>
            </div>
            <div class="card-footer small text-muted" id="total"></div>
        </div>
    </main>

    <div class="modal fade" id="modalFormulario" tabindex="-1">
        <div class="modal-dialog">
            <form class="modal-content" id="formCadastro">
                <div class="modal-header">
                    <h5 class="modal-title" id="tituloModal">Nova categoria</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label" for="campoNome">Nome *</label>
                        <input class="form-control" id="campoNome" name="nome" required maxlength="50">
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="campoDescricao">Descrição</label>
                        <textarea class="form-control" id="campoDescricao" name="descricao" rows="2" maxlength="200"></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="campoValor">Valor da diária (R$) *</label>
                        <input class="form-control" id="campoValor" name="valorDiaria" type="number" min="0.01" step="0.01" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/categorias.js"></script>
</body>
</html>
