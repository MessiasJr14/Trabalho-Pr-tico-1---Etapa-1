<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Veículos | Locadora de Veículos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/estilo.css" rel="stylesheet">
</head>
<body>
    <div id="menu"></div>

    <main class="container-fluid px-lg-5 py-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <h1 class="h3 mb-0">Veículos</h1>
                <span class="rota">GET /api/veiculos?modelo=&amp;placa=&amp;fabricanteId=&amp;categoriaId=&amp;disponivel=</span>
            </div>
            <button class="btn btn-primary" id="btnNovo"><i class="bi bi-plus-lg"></i> Novo veículo</button>
        </div>

        <form id="formFiltro" class="card card-body mb-3">
            <div class="row g-2 align-items-end">
                <div class="col-md-3">
                    <label class="form-label" for="filtroModelo">Modelo</label>
                    <input class="form-control" id="filtroModelo" name="modelo" placeholder="Ex.: Corolla">
                </div>
                <div class="col-md-2">
                    <label class="form-label" for="filtroPlaca">Placa</label>
                    <input class="form-control text-uppercase" id="filtroPlaca" name="placa" placeholder="Ex.: ABC1D23">
                </div>
                <div class="col-md-2">
                    <label class="form-label" for="filtroFabricante">Fabricante</label>
                    <select class="form-select" id="filtroFabricante" name="fabricanteId"></select>
                </div>
                <div class="col-md-2">
                    <label class="form-label" for="filtroCategoria">Categoria</label>
                    <select class="form-select" id="filtroCategoria" name="categoriaId"></select>
                </div>
                <div class="col-md-1">
                    <label class="form-label" for="filtroDisponivel">Status</label>
                    <select class="form-select" id="filtroDisponivel" name="disponivel">
                        <option value="">Todos</option>
                        <option value="true">Disponível</option>
                        <option value="false">Alugado</option>
                    </select>
                </div>
                <div class="col-md-2 d-flex gap-2">
                    <button class="btn btn-secondary flex-fill" type="submit"><i class="bi bi-search"></i> Pesquisar</button>
                    <button class="btn btn-outline-secondary" type="reset">Limpar</button>
                </div>
            </div>
        </form>

        <div class="card">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead>
                        <tr>
                            <th>Modelo</th>
                            <th>Placa</th>
                            <th>Ano</th>
                            <th class="text-end">Km</th>
                            <th>Cor</th>
                            <th>Fabricante</th>
                            <th>Categoria</th>
                            <th>Status</th>
                            <th class="acoes">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabela"></tbody>
                </table>
            </div>
            <div class="card-footer small text-muted" id="total"></div>
        </div>
    </main>

    <div class="modal fade" id="modalFormulario" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <form class="modal-content" id="formCadastro">
                <div class="modal-header">
                    <h5 class="modal-title" id="tituloModal">Novo veículo</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label" for="campoModelo">Modelo *</label>
                            <input class="form-control" id="campoModelo" name="modelo" required maxlength="80">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label" for="campoPlaca">Placa *</label>
                            <input class="form-control text-uppercase" id="campoPlaca" name="placa" required maxlength="8">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label" for="campoAno">Ano de fabricação *</label>
                            <input class="form-control" id="campoAno" name="anoFabricacao" type="number" min="1950" max="2100" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label" for="campoKm">Quilometragem *</label>
                            <input class="form-control" id="campoKm" name="quilometragem" type="number" min="0" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label" for="campoCor">Cor</label>
                            <input class="form-control" id="campoCor" name="cor" maxlength="30">
                        </div>
                        <div class="col-md-4 d-flex align-items-end">
                            <div class="form-check form-switch mb-2">
                                <input class="form-check-input" type="checkbox" id="campoDisponivel" name="disponivel" checked>
                                <label class="form-check-label" for="campoDisponivel">Disponível para aluguel</label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="campoFabricante">Fabricante *</label>
                            <select class="form-select" id="campoFabricante" name="fabricanteId" required></select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="campoCategoria">Categoria *</label>
                            <select class="form-select" id="campoCategoria" name="categoriaId" required></select>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/veiculos.js"></script>
</body>
</html>
